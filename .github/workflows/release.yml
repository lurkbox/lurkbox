# A v* tag builds the AppImage and the release-signed Android APK and publishes them, with SHA-256 checksums, as a
# GitHub release. The Flatpak workflow publishes the same tag to the Flatpak repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage
          retention-days: 3

  android:
    name: Android APK (release-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Build the release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          LURKBOX_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_RELEASE_KEYSTORE secret missing"; exit 1; }
          export LURKBOX_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$LURKBOX_RELEASE_KEYSTORE"
          npm run android:release
          rm -f "$LURKBOX_RELEASE_KEYSTORE"
          mkdir -p out
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk "out/Lurkbox-${GITHUB_REF_NAME#v}-android.apk"
      - name: Check the APK is signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | tee certs.txt
          ! grep -q "CN=Android Debug" certs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: out/*.apk
          retention-days: 3

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [appimage, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "Lurkbox $GITHUB_REF_NAME" --generate-notes --verify-tag
