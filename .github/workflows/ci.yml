# Runs on every pull request and on pushes to main. Branch protection on main requires these jobs to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install (no install scripts, no Electron binary)
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          for f in $(git ls-files 'packages/*/src/**/*.js' 'apps/*/src/**/*.js' 'apps/*/*.config.js' 'apps/*/test/**/*.js'); do node --check "$f" || exit 1; done
      - name: Unit tests (all workspaces)
        run: npm test

  smoke:
    name: Launch smoke test
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install with only Electron's install script
        run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - name: Run the app once under a virtual display
        # GitHub's Ubuntu runners block Chromium's SUID sandbox helper and user namespaces for unprivileged users.
        # The sandbox is only switched off here, for this CI smoke test; the app itself keeps it.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:smoke
      - name: Drops against the inventory fixture
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:drops
      - name: Follow against the channel page fixture
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:follow
      - name: The twitch.tv session reaches the chat frame (SameSite=None cookies)
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:points-cookies
      - name: Chat sending in demo mode (offline)
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:chat-send
      - name: Channel pages in demo mode (offline)
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:channel
      - name: Continue watching in demo mode (offline)
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:continue

  package:
    name: AppImage builds
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lurkbox-AppImage
          path: dist/*.AppImage
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      # The runner's preinstalled Android SDK ($ANDROID_HOME); the Android Gradle Plugin fetches a missing platform.
      # Signed with Android's default debug key (the stable local key never leaves the developer's machine).
      - name: Build the debug APK
        run: npm run android:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lurkbox-Android-debug-APK
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The release file is checked against the SHA-256 from gitleaks' published checksums for v8.30.1.
        run: |
          curl -sSfL -o gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
