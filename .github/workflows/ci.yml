# Runs on every pull request and on pushes to main. Branch protection on main requires these jobs to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (no install scripts, no Electron binary)
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          for f in $(git ls-files 'packages/*/src/**/*.js' 'apps/*/src/**/*.js' 'apps/*/*.config.js' 'apps/*/test/**/*.js'); do node --check "$f" || exit 1; done
      - name: Unit tests (all workspaces)
        run: npm test

  smoke:
    name: Launch smoke test
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install with only Electron's install script
        run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - name: Let Chromium's SUID sandbox helper run (GitHub runners need root ownership)
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run the app once under a virtual display
        run: xvfb-run -a npm run test:smoke

  package:
    name: AppImage builds
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Lurkbox-AppImage
          path: dist/*.AppImage
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
