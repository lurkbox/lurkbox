# Builds the Flatpak and publishes it, as a signed OSTree repository, to GitHub Pages: https://lurkbox.github.io/lurkbox/
# Pull requests only build (unsigned, nothing published). Tag pushes (v*) and manual runs sign and publish.
# Not Flathub: see docs/flatpak.md.
name: Flatpak

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MANIFEST: apps/desktop/flatpak/io.github.lurkbox.Lurkbox.yml
  APP_ID: io.github.lurkbox.Lurkbox
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Flatpak build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install with only Electron's install script
        run: |
          npm ci --ignore-scripts
          npm rebuild electron
      - name: Build the app (electron-builder dir output)
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.config.js --linux dir --x64 --publish never
      - name: Install flatpak and flatpak-builder
        # bubblewrap needs unprivileged user namespaces, which the runner's AppArmor policy restricts. CI only.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak flatpak-builder appstream desktop-file-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Validate the metainfo and desktop file
        run: |
          appstreamcli validate --no-net apps/desktop/flatpak/$APP_ID.metainfo.xml
          desktop-file-validate apps/desktop/flatpak/$APP_ID.desktop
      - name: Import the signing key
        if: env.PUBLISH == 'true'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          test -n "$FLATPAK_GPG_KEY" || { echo "::error::The FLATPAK_GPG_KEY secret is not set"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --quiet --import
          want=$(gpg --show-keys --with-colons docs/flatpak/lurkbox-flatpak.gpg | awk -F: '/^fpr/{print $10; exit}')
          have=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          # The published .flatpakref/.flatpakrepo carry the committed public key, so the secret must match it.
          test "$want" = "$have" || { echo "::error::FLATPAK_GPG_KEY does not match docs/flatpak/lurkbox-flatpak.gpg"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGN_ARGS=--gpg-sign=$have --gpg-homedir=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build the Flatpak into an OSTree repo
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --default-branch=stable --repo=repo $SIGN_ARGS build-dir "$MANIFEST"
      - name: Update the repo (appstream data, static deltas, signed summary)
        run: |
          flatpak build-update-repo --generate-static-deltas --prune --default-branch=stable \
            --title=Lurkbox --homepage=https://github.com/lurkbox/lurkbox $SIGN_ARGS repo
      - name: Install from the repo and check it
        run: |
          if [ "$PUBLISH" = true ]; then
            flatpak remote-add --user --gpg-import=docs/flatpak/lurkbox-flatpak.gpg check "file://$PWD/repo"
          else
            flatpak remote-add --user --no-gpg-verify check "file://$PWD/repo"
          fi
          flatpak install --user -y --noninteractive check "$APP_ID"
          flatpak info --user "$APP_ID"
          flatpak run --user --command=sh "$APP_ID" -c 'test -x /app/lurkbox/lurkbox && test -x /app/bin/lurkbox && test -f /app/lurkbox/resources/app.asar'
          flatpak remote-ls --user --app check
      - name: Assemble the site
        run: |
          mkdir _site
          cp -a repo _site/repo
          cp apps/desktop/flatpak/site/index.html apps/desktop/flatpak/site/lurkbox.flatpakrepo \
            apps/desktop/flatpak/site/$APP_ID.flatpakref docs/flatpak/lurkbox-flatpak.gpg _site/
          cp assets/icons/128x128.png _site/icon.png
          du -sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.PUBLISH == 'true'
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
